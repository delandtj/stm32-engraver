# pcbkit settings for the graver controller (ADR 0005: 4-layer JLC04161H-7628,
# 85 x 60 mm ceiling, granite_controller style). Tools: ~/Electronics/pcbkit.
# Pipeline: tools/pcb5/build.sh (netlist -> mkboard -> outline -> setrules ->
# place.py -> krt-route -> ... -> gndpour -> silk -> connlabels -> render).

[project]
name = "graver-controller"

[mkboard]
copper_layers = 4

[outline]
# ADR 0005 Decision 2: target 75 x 55, ceiling 85 x 60. Current size below.
length = 85.0
height = 60.0
origin = [50.0, 50.0]
radius = 1.0
# The four M3 holes are schematic parts (MH401-MH404, IO sheet) placed by
# tools/pcb5/place.py, so outline adds none of its own.
hole_refs = []

[rules]
stackup = "jlc04161h-7628"
layers = { "In1.Cu" = ["power", "GND"], "In2.Cu" = ["power", "+3V3"] }

# USB 0.25/0.15 on 0.2104 mm 7628 over the In1 GND plane: 90-92 ohm by the
# Hammerstad-Jensen microstrip formula (Er 4.4-4.6), the same geometry
# granite_controller solved to 89 ohm with a 2D field solver.
# Two via sizes on the whole board: 0.5/0.2 signal, 0.6/0.3 power.
[rules.netclasses]
# name = [track, clearance, via_dia, via_drill, diff_width, diff_gap]
Default     = [0.2,  0.15, 0.5, 0.2]
GND         = [0.4,  0.2,  0.6, 0.3]
PWR_3V3     = [0.4,  0.2,  0.6, 0.3]
PWR_5V      = [0.5,  0.2,  0.6, 0.3]
HighCurrent = [0.8,  0.2,  0.6, 0.3]
USB         = [0.25, 0.15, 0.5, 0.2, 0.25, 0.15]

[gndpour]
short_edge_inset = 1.0

[silk]
order = ["J", "U", "Q", "D", "L", "Y", "SW", "F"]

[connlabels]
# placement is greedy in table order: keep this order
names = { J101 = "24V IN", J301 = "USB", J201 = "HANDPIECE", J402 = "PEDAL", J302 = "SWD", J401 = "DISPLAY", J403 = "ENCODER" }

[connlabels.legends]
J101 = ["G", "+"]
J201 = ["VI", "CN", "NT", "G"]
# J302 (SWD, vertical 1x5 inside the board): no pin legends, connlabels stacks
# them on one point there; the pin order is in the schematic and HANDOFF.md.
J401 = ["G", "3V", "CL", "DA", "RS", "DC", "BL"]
J402 = ["T", "RN", "R", "S"]
J403 = ["A", "G", "B", "SW"]

[viaout]
keep = [["U301", "49"]]      # QFN48 EP thermal vias stay in the pad

[jlcfab]
out = "fab"
lcsc_field = "LCSC"
mpn_field = "MPN"
# Rotation corrections KiCad -> JLC for the parts the built-in (granite) table
# does not know, verified per LCSC number against the EasyEDA footprint JLC
# places with (tools/pcb5/cplcheck.py fits the KiCad pads onto it). JLC's
# footprints differ per part even within one package: the two SOT-23-5s
# here need 270 and 180.
corrections = [
  ["^SOT-23$",                    "", 180, 0, 0],   # Q202 SI2309, Q203 BSS123, U401 PESD5V0S2BT
  ["^SOT-23-5$",             "C51118", 270, 0, 0],   # U102 AP2112K: EasyEDA pin 1 lower left
  ["^SOT-23-5$",                  "", 180, 0, 0],   # U201 UCC27517
  ["^SOT-223-3_TabPin2$",         "", 180, 0, 0],   # Q101 DMP6023LE
  ["^TO-252-2$",                  "",  90, 0, 0],   # Q201 IRLR3410: leads up, pin 1 right
  ["^HSOP-8-1EP_3.9x4.9mm_P1.27mm_EP2.41x3.1mm$", "", 270, 0, 0],   # U101 LM5164, SOIC-8 body
  ["^QFN-48-1EP_7x7mm_P0.5mm_EP5.6x5.6mm$",       "", 270, 0, 0],   # U301 STM32F411, as LQFP-48
  ["^D_SOD-123$",                 "",   0, 0, 0],   # D101 D203 BZT52C12
  ["^D_SMB$",                     "",   0, 0, 0],   # D102 SMBJ36A, D202 SMBJ24A
  ["^LED_0805_2012Metric$",  "C2297", 180, 0, 0],   # D104: EasyEDA pad 1 is the anode here
  ["^LED_0603_1608Metric$",  "C2286", 180, 0, 0],   # D301: same
  ["^Crystal_SMD_3225-4Pin_3.2x2.5mm$", "", 0, 0, 0],   # Y301
  ["^SW_Push_1P1T_XKB_TS-1187A$", "",   0, 0, 0],   # SW301 SW302: 0 or 180 both fit, 90 would not
  ["^CP_Radial_D12.5mm_P5.00mm$", "",   0, 0, 0],   # C101, THT: pad 1 = + in both libraries
  ["^PinHeader_1x05_P2.54mm_Vertical$", "", 270, 0, 0],   # J302, THT: EasyEDA row runs along x
  ["^L_Changjiang_FXL0630$",      "", 180, 0, 0],   # L101: unpolarized, EasyEDA is KiCad + 180
]

[krt]
dir = "~/.cache/graver-pcb/routetest/KiCadRoutingTools"
python = "~/.cache/graver-pcb/routetest/venv/bin/python"
work = "~/.cache/graver-pcb/pcbkit/route"
rework = "~/.cache/graver-pcb/pcbkit/reroute"
clearance = 0                     # KRT uses the net class clearances (0.15 signal, 0.2 power)
via = [0.5, 0.2]
track_width = 0.2
same_net_pad_clearance = 0.15     # no vias in SMD pads
signal_layers = ["F.Cu", "B.Cu"]  # In1/In2 stay solid planes
keep_groups = ["hand"]            # tools/pcb5/handroute.py copper survives krt-route
route_extra = ["--ordering", "mps"]
power_nets   = ["GND", "+3V3", "*VDDA", "+5V", "VBUS", "*D105-A*", "VIN", "*COIL_NEG", "*CLAMP", "*SHUNT_HI", "*U101-SW*", "*J101-Pin_2*", "*Q101-D*"]
power_widths = [0.4,   0.4,    0.4,     0.5,   0.5,    0.5,        0.8,   0.8,        0.8,      0.8,         0.8,          0.8,             0.8]
planes = { nets = ["GND", "+3V3"], layers = ["In1.Cu", "In2.Cu"], via = [0.6, 0.3] }
ground = { net = "GND", width = 0.4 }

# No [[krt.diff]]: the USB pair is scripted in tools/pcb5/handroute.py; KRT's
# route_diff.py re-laid it at 0.2 mm even when it was already connected.
